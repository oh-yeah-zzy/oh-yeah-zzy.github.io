<div class="terminal-hero">
  <div class="terminal-header">
    <span class="terminal-button red"></span>
    <span class="terminal-button yellow"></span>
    <span class="terminal-button green"></span>
  </div>
  <div class="terminal-body">
    <span class="terminal-prompt">zzy@ustc:~$</span>
    <span class="terminal-text" id="terminal-typing"></span>
    <span class="terminal-cursor" id="terminal-cursor"></span>
  </div>
</div>

<script>
// 终端打字动画 - 带调试日志
(function() {
  console.log('[Terminal] Script loading...');

  var terminalTyping = document.getElementById('terminal-typing');
  var terminalCursor = document.getElementById('terminal-cursor');

  console.log('[Terminal] terminalTyping element:', terminalTyping);
  console.log('[Terminal] terminalCursor element:', terminalCursor);

  if (terminalTyping && terminalCursor) {
    console.log('[Terminal] Both elements found, initializing animation');

    var text = ' 天文台控制系统 · 科研机相机 · 代码与星空';
    var index = 0;
    var typingSpeed = 80;

    console.log('[Terminal] Text to type:', text);
    console.log('[Terminal] Text length:', text.length);

    function typeText() {
      console.log('[Terminal] typeText called, index:', index, 'char:', text.charAt(index));

      if (index < text.length) {
        terminalTyping.textContent += text.charAt(index);
        console.log('[Terminal] Current content:', terminalTyping.textContent);
        index++;
        setTimeout(typeText, typingSpeed);
      } else {
        console.log('[Terminal] Animation complete');
      }
    }

    // 延迟 500ms 开始打字
    console.log('[Terminal] Starting animation in 500ms');
    setTimeout(function() {
      console.log('[Terminal] Timeout fired, calling typeText');
      typeText();
    }, 500);
  } else {
    console.error('[Terminal] Elements not found!');
    if (!terminalTyping) console.error('[Terminal] Missing: terminal-typing');
    if (!terminalCursor) console.error('[Terminal] Missing: terminal-cursor');
  }
})();
</script>
