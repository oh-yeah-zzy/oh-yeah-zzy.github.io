<!-- 极客风主题 - 终端打字动画 -->
<script>
(function() {
  // 确保在 DOM 完全加载后执行
  function initTerminalAnimation() {
    const terminalTyping = document.getElementById('terminal-typing');
    const terminalCursor = document.getElementById('terminal-cursor');

    if (terminalTyping && terminalCursor) {
      const text = ' 天文台控制系统 · 科研机相机 · 代码与星空';
      let index = 0;
      const typingSpeed = 80; // 每个字符的打字速度（毫秒）

      function typeText() {
        if (index < text.length) {
          terminalTyping.textContent += text.charAt(index);
          index++;
          setTimeout(typeText, typingSpeed);
        } else {
          // 打字完成后，保持光标闪烁
          terminalCursor.style.display = 'inline-block';
        }
      }

      // 页面加载后延迟 500ms 开始打字
      setTimeout(typeText, 500);
    }
  }

  // 确保在 DOMContentLoaded 后执行
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTerminalAnimation);
  } else {
    initTerminalAnimation();
  }
})();
</script>
